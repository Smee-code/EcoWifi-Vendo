# dnsmasq configuration for the EcoWifi Vendo access point.
#
# Handles DHCP for connecting clients and DNS-hijacks every domain to
# this machine's own AP IP address. This is what forces phones/laptops
# to load the captive portal instead of the real internet -- their OS
# tries to reach a real domain, gets pointed back at this machine, and
# the captive-portal-detection popup fires automatically.
#
# Replace <AP_INTERFACE> with your USB WiFi adapter's interface name,
# and <AP_IP_ADDRESS> with the static IP you assign to that interface
# (must match what you configure on the interface itself, e.g. via
# /etc/network/interfaces or netplan).
#
# <DHCP_RANGE_START> / <DHCP_RANGE_END> must be on the same /24 as
# <AP_IP_ADDRESS> -- install.sh derives them from the AP IP you enter,
# so they can never drift apart. If you fill this in by hand instead,
# an AP IP of 192.168.50.1 means a range like 192.168.50.10 to
# 192.168.50.200.

interface=<AP_INTERFACE>
bind-interfaces

# DHCP range handed out to clients connecting to the AP
dhcp-range=<DHCP_RANGE_START>,<DHCP_RANGE_END>,255.255.255.0,12h

# Redirect every domain name to this machine's own AP IP -- the actual
# captive-portal-triggering mechanism
address=/#/<AP_IP_ADDRESS>
