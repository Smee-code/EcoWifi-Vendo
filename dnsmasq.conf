# dnsmasq configuration for the vendo access point.
#
# Two jobs: hand out addresses to clients, and resolve names for them.
#
# Replace <AP_INTERFACE> with your WiFi adapter's interface name,
# <AP_IP_ADDRESS> with the static IP assigned to it, and the DHCP range
# with addresses on that same subnet. install.sh fills all of these in.

interface=<AP_INTERFACE>

# bind-dynamic, NOT bind-interfaces. A USB adapter enumerates late, and
# bind-interfaces makes dnsmasq fail at boot if the interface is not
# already present and addressed. bind-dynamic copes with it appearing
# afterwards, which is the normal case on a machine that just booted.
bind-dynamic

# Answer only on the AP side. Without this dnsmasq would also listen on
# the WAN interface, offering DHCP to the upstream network.
except-interface=<WAN_INTERFACE>
no-dhcp-interface=<WAN_INTERFACE>

# Be the authority for this subnet, so a client that arrives with a stale
# lease from another network is corrected immediately instead of waiting
# for its lease to expire.
dhcp-authoritative

# DHCP range handed out to clients connecting to the AP
dhcp-range=<DHCP_RANGE_START>,<DHCP_RANGE_END>,255.255.255.0,12h

# The access point's own management address. It is a client of this DHCP
# server like any phone, but pinned by MAC so its admin page never moves
# -- an AP whose address changes on every lease is one you cannot log
# into when something is wrong. The address sits below the pool, so it
# can never collide with a customer's lease.
<AP_RESERVATION>

# Point clients at this machine for DNS and as their gateway
dhcp-option=option:dns-server,<AP_IP_ADDRESS>
dhcp-option=option:router,<AP_IP_ADDRESS>

# NOTE ON CAPTIVE PORTAL DETECTION
#
# This deliberately does NOT hijack DNS. An earlier version had
# `address=/#/<AP_IP_ADDRESS>`, which resolves every domain to this
# machine -- for every client, including customers who have paid. Their
# browsers would resolve google.com to the portal and they would have no
# internet at all despite being granted.
#
# The portal is presented by the nftables rule in setup_nftables.sh
# instead: un-granted clients have their port 80 traffic redirected here,
# whatever they resolved. Phones detect a captive portal by fetching a
# known HTTP URL and checking the response, so the redirect is what makes
# the sign-in notification appear. Granted clients are not redirected and
# get real DNS answers, which is the whole point of paying.
