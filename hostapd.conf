# hostapd configuration for the EcoWifi Vendo access point.
#
# Broadcasts an OPEN network -- customers connect for free, then pay
# with a bottle to get past the captive portal and reach the internet.
# This matches how LPB/AdoPiSoft-style piso-wifi systems normally work:
# no WiFi password, payment gates internet access instead.
#
# Replace <AP_INTERFACE> with your USB WiFi adapter's interface name
# (find it with: ip link show). Per the spec document, prefer a
# dedicated USB WiFi adapter over the Orange Pi's onboard WiFi, since
# many onboard SBC chips don't support hostapd AP mode reliably.

interface=<AP_INTERFACE>
driver=nl80211

# 2.4GHz band -- broadest device compatibility for a public vendo AP
hw_mode=g
channel=6

# Country code -- required for correct regulatory power/channel limits.
# Change to your actual country if not the Philippines.
ieee80211d=1
country_code=PH

# 802.11n + QoS (needed for full-speed throughput)
ieee80211n=1
wmm_enabled=1

ssid=EcoWifi

# Open network: no encryption at all. auth_algs=1 is open-system auth,
# and wpa=0 disables WPA/WPA2 entirely.
auth_algs=1
wpa=0
