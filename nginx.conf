# nginx front end for the vendo gateway.
#
# Two jobs:
#   1. Serve the captive portal over plain HTTP on :80. It MUST stay HTTP:
#      phones probe a known URL to detect a captive portal, and a portal
#      behind a self-signed certificate fails that probe (and shows a
#      scary warning), so customers would never see the sign-in page.
#   2. Force the admin dashboard onto HTTPS. The SSID is open, so anyone
#      in range can capture traffic on it -- an admin password sent over
#      plain HTTP is readable by every customer in the car park.
#
# The certificate is self-signed, so a browser warns once on the admin
# page. That is expected: the operator clicks through once on their own
# device. It still defeats passive sniffing, which is the actual threat
# here. Replace with a real certificate if this ever gets a domain name.
#
# install.sh fills in <PORTAL_PORT>.

upstream ecowifi_app {
    server 127.0.0.1:<PORTAL_PORT>;
}

# ---- HTTP: captive portal, and a hard bounce for /admin ----
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Anything under /admin must never be spoken in the clear.
    location /admin {
        return 301 https://$host$request_uri;
    }

    location / {
        proxy_pass http://ecowifi_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
}

# ---- HTTPS: the admin dashboard ----
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/ssl/ecowifi/ecowifi.crt;
    ssl_certificate_key /etc/ssl/ecowifi/ecowifi.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:2m;
    ssl_session_timeout 1h;

    # Sent only over HTTPS, and deliberately NOT includeSubDomains: the
    # portal on :80 has to keep working for captive-portal detection.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Backups are streamed through here, so do not cap the body size at
    # nginx's 1 MB default or restore would fail on a real database.
    client_max_body_size 64m;

    location / {
        proxy_pass http://ecowifi_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
}
