<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcoWifi Admin &mdash; Sign in</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center;
         justify-content: center; background: #101820; color: #e6edf3;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { width: 100%; max-width: 360px; background: #16212c; padding: 30px 26px;
          border: 1px solid #223040; border-radius: 10px; margin: 16px; }
  h1 { margin: 0 0 4px; font-size: 1.15rem; }
  p.sub { margin: 0 0 22px; color: #7d93a8; font-size: .82rem; }
  label { display: block; font-size: .78rem; color: #9db2c6; margin-bottom: 6px; }
  input { width: 100%; background: #0f1923; border: 1px solid #2b3c4e; color: #e6edf3;
          border-radius: 6px; padding: 10px; font-size: .95rem; }
  button { width: 100%; margin-top: 16px; padding: 11px; border: 0; border-radius: 6px;
           background: #226e43; color: #fff; font-size: .95rem; font-weight: 600;
           cursor: pointer; }
  button:hover:enabled { background: #2b8a54; }
  button:disabled { opacity: .6; cursor: not-allowed; }
  #msg { margin: 14px 0 0; font-size: .82rem; min-height: 1.1em; color: #e08585; }
  .hint { margin-top: 18px; font-size: .72rem; color: #5d7286; line-height: 1.5; }
  code { background: #0f1923; padding: 1px 5px; border-radius: 3px; color: #8fd6ff; }
</style>
</head>
<body>
  <div class="card">
    <h1>EcoWifi Admin</h1>
    <p class="sub">Operator sign-in</p>

    <form onsubmit="signIn(event)">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" autofocus>
      <button type="submit" id="btn">Sign in</button>
    </form>

    <p id="msg"></p>

    <p class="hint">
      Forgot it? On the Orange Pi, stop the app, delete the admin password
      row from the database, and restart &mdash; a new one-time setup token
      is printed to <code>journalctl -u ecowifi-app</code>.
    </p>
  </div>

<script>
async function signIn(e) {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  btn.disabled = true;
  msg.innerText = '';

  try {
    const res = await fetch('/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('password').value })
    });
    const data = await res.json().catch(() => ({}));

    if (res.ok) { window.location = '/admin'; return; }
    msg.innerText = data.detail || 'Could not sign in.';
  } catch (err) {
    msg.innerText = 'Could not reach the server.';
  }
  btn.disabled = false;
}
</script>
</body>
</html>
